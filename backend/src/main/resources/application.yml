# Base configuration, shared by every environment.
# Database connection settings are NOT here: they come from the environment
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD), from application-dev.yml
# for local development, or from Testcontainers in integration tests.
spring:
  application:
    name: tickettriage
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB session open while the JSON response is rendered.
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  ai:
    model:
      # Which chat model auto-configuration is active: "anthropic" or "none" (see application-mock.yml).
      chat: anthropic
    anthropic:
      # From the environment only. Never commit a real key.
      api-key: ${ANTHROPIC_API_KEY:}
      # Fail fast so the user gets the fallback quickly instead of a hanging request.
      timeout: 60s
      max-retries: 1
      chat:
        model: ${ANTHROPIC_MODEL:claude-opus-5-5}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
