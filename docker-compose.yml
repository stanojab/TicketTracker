name: tickettriage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickettriage
      POSTGRES_USER: tickettriage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickettriage}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickettriage -d tickettriage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
